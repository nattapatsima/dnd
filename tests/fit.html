<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quickstep sheet fit check</title>
<style>
body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
.fail { color: #b3261e; }
iframe { border: 1px solid #999; display: block; margin-top: 12px; }
</style>
</head>
<body>
<h1>Play tab fit check</h1>
<div id="results">Running…</div>
<div id="frames"></div>
<script type="module">
import { test, ok, run } from './runner.js';

// The installed app's usable area on each current iPad in landscape: the screen minus the
// status bar (24 px, or 20 px on home-button iPads) and the home-indicator inset (20 px).
const SIZES = [
  [1024, 748], // 9.7"
  [1080, 790], // 10.2"
  [1133, 700], // iPad mini
  [1180, 776], // 10.9" / 11" Air
  [1194, 790], // 11" Pro
  [1366, 980], // 12.9" / 13"
];
// Room left for wider iPad fonts (SF Pro) than the test browser's.
const SLACK = 20;

function load(width, height) {
  return new Promise((resolve) => {
    const frame = document.createElement('iframe');
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    frame.onload = () => setTimeout(() => resolve(frame), 400);
    frame.src = '../index.html';
    document.getElementById('frames').appendChild(frame);
  });
}

window.__fit = [];
for (const [width, height] of SIZES) {
  test(`Play tab fits ${width} × ${height}`, async () => {
    const frame = await load(width, height);
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    // Bottom of the content, including the page's bottom padding.
    const bottom = () => Math.ceil(doc.getElementById('app').getBoundingClientRect().bottom
      + parseFloat(win.getComputedStyle(doc.body).paddingBottom));
    const calm = bottom();
    // Busiest screen: the short-rest message with Undo, plus the amount error.
    doc.querySelector('[data-action="short-rest"]').click();
    doc.querySelector('[data-action="damage"]').click();
    const busy = bottom();
    const wide = doc.documentElement.scrollWidth;
    const amountFont = parseFloat(win.getComputedStyle(doc.querySelector('#amount')).fontSize);
    const bodyFont = parseFloat(win.getComputedStyle(doc.body).fontSize);
    const labelFont = parseFloat(win.getComputedStyle(doc.querySelector('.label')).fontSize);
    doc.querySelector('[data-action="undo"]')?.click();
    const smallTargets = [...doc.querySelectorAll('button, [data-action]')]
      .filter((el) => { const box = el.getBoundingClientRect(); return box.width > 0 && box.height < 44; }).length;
    const fits = Math.max(calm, busy) + SLACK <= height && wide <= width;
    // Notes tab: the backup buttons stay on one line.
    doc.querySelector('[data-action="tab"][data-arg="notes"]').click();
    const importBtn = doc.querySelector('[data-action="import"]');
    const importOneLine = importBtn && importBtn.getBoundingClientRect().height <= 46;
    window.__fit.push({ size: `${width} × ${height}`, fits, calm, busy, wide, smallTargets, amountFont, bodyFont, labelFont, importOneLine });
    frame.remove();
    ok(fits, `content ends at ${calm}, busy ${busy} (needs ≤ ${height - SLACK}), width ${wide}`);
    ok(smallTargets === 0, `${smallTargets} touch targets under 44 px`);
    ok(bodyFont >= 16, `body text ${bodyFont} px (needs at least 16 px to read at the table)`);
    ok(labelFont >= 13, `labels ${labelFont} px (needs at least 13 px)`);
    ok(importOneLine, 'Import backup button fits on one line');
    ok(amountFont >= 16, `Amount field font ${amountFont} px (under 16 px makes the iPad zoom on tap)`);
  });
}

run();
</script>
</body>
</html>
