<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quickstep sheet fit check</title>
<style>
body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
.fail { color: #b3261e; }
iframe { border: 1px solid #999; display: block; margin-top: 12px; }
</style>
</head>
<body>
<h1>Play tab fit check</h1>
<div id="results">Running…</div>
<div id="frames"></div>
<script type="module">
import { test, ok, run } from './runner.js';

// Every current iPad landscape size, smallest first.
const SIZES = [[1024, 744], [1080, 810], [1133, 744], [1180, 820], [1366, 1024]];

function load(width, height) {
  return new Promise((resolve) => {
    const frame = document.createElement('iframe');
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    frame.onload = () => setTimeout(() => resolve(frame), 400);
    frame.src = '../index.html';
    document.getElementById('frames').appendChild(frame);
  });
}

window.__fit = [];
for (const [width, height] of SIZES) {
  test(`Play tab fits ${width} × ${height}`, async () => {
    const frame = await load(width, height);
    const doc = frame.contentDocument;
    const page = doc.documentElement;
    const measure = () => [page.scrollWidth, page.scrollHeight];
    const calm = measure();
    // Busiest screen: Undo showing after damage, plus the amount error.
    doc.querySelector('#amount').value = '1';
    doc.querySelector('[data-action="damage"]').click();
    doc.querySelector('[data-action="damage"]').click();
    const busy = measure();
    doc.querySelector('[data-action="undo"]')?.click();
    const smallTargets = [...doc.querySelectorAll('button, [data-action]')]
      .filter((el) => { const box = el.getBoundingClientRect(); return box.width > 0 && box.height < 44; }).length;
    const fitsIn = ([w, h]) => w <= width && h <= height;
    const fits = fitsIn(calm) && fitsIn(busy);
    window.__fit.push({ size: `${width} × ${height}`, fits, smallTargets, calm, busy });
    frame.remove();
    ok(fits, `page is ${calm.join(' × ')}, busy ${busy.join(' × ')}`);
    ok(smallTargets === 0, `${smallTargets} touch targets under 44 px`);
  });
}

run();
</script>
</body>
</html>
